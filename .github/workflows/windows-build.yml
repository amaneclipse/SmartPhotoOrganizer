name: Windows build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m PyInstaller --clean --noconfirm pyinstaller.spec
      - shell: pwsh
        run: Compress-Archive -Path dist/SmartPhotoOrganizer -DestinationPath SmartPhotoOrganizer-windows.zip
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: SmartPhotoOrganizer-windows.zip
